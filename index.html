<div id="app"><div class="loading">جاري التحميل…</div></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const fmtN=n=>r2(n).toLocaleString("en-US",{maximumFractionDigits:2});
const money=n=>`<span class="num">${fmtN(n)}</span> ج.م`;
const moneyT=n=>fmtN(n)+" ج.م";
const sgn=n=>`<span class="${r2(n)<0?"neg":r2(n)>0?"pos":""}">${money(n)}</span>`;
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const dStr=s=>s?`<span class="num">${esc(s)}</span>`:"—";
const dayDiff=(a,b)=>Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const clone=o=>JSON.parse(JSON.stringify(o));
const EMAIL_DOMAIN="@shoqaq.app";
function toast(t,bad){const el=document.createElement("div");el.className="toast"+(bad?" bad":"");el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),bad?4500:2600)}
function errMsg(e){const m=(e&&(e.message||e.error_description||e.msg))||String(e||"");
  if(/row-level security|permission denied/i.test(m))return "ليس لديك صلاحية لهذه العملية";
  if(/foreign key/i.test(m))return "لا يمكن الحذف لوجود بيانات مرتبطة بيه (مثلاً تحصيلات على العقد أو عقود على الشقة)";
  if(/duplicate key.*no|contracts_no_key/i.test(m))return "رقم العقد ده موجود قبل كده";
  if(/duplicate key/i.test(m))return "القيمة دي موجودة قبل كده";
  if(/Invalid login credentials/i.test(m))return "اسم المستخدم أو الباسورد غلط";
  if(/Failed to fetch|NetworkError/i.test(m))return "مفيش اتصال بالإنترنت أو السيرفر متوقف";
  if(/check constraint/i.test(m))return "فيه قيمة غير مسموحة، راجع البيانات";
  return m}
async function q(p){const {data,error}=await p;if(error)throw error;return data}

/* ---------- state ---------- */
const S={user:null,profile:null,L:{apartments:[],owners:[],employees:[],partners:[],users:[],cashboxes:[]},pendingTr:0,rep:store.get("dk.rep")||"cash",repBox:"",settings:{company:{},partner_shares:{periods:[]}},
  tab:store.get("dk.tab")||"dash",from:store.get("dk.from")||"",to:store.get("dk.to")||"",sel:{},pendingCount:0};
if(!S.from||!S.to){const d=new Date();S.from=iso(new Date(d.getFullYear(),d.getMonth(),1));S.to=iso(new Date(d.getFullYear(),d.getMonth()+1,0))}
const isAdmin=()=>!!(S.profile&&S.profile.is_admin);
const lvl=s=>isAdmin()?4:+((S.profile&&S.profile.perms&&S.profile.perms.screens&&S.profile.perms.screens[s])||0);
const flag=f=>isAdmin()||!!(S.profile&&S.profile.perms&&S.profile.perms[f]);
const lname=(k,id)=>{const x=(S.L[k]||[]).find(o=>o.id===id);return x?x.name:"—"};
const inP=d=>d>=S.from&&d<=S.to;

const SCREENS=[["dash","الملخص"],["contracts","العقود"],["payments","التحصيلات"],["fees","الرسوم"],["expenses","المصروفات"],["tenants","المستأجرين"],["apartments","الشقق"],["maintenance","الصيانة"],["owners","الملاك"],["employees","الموظفين"],["partners","الشركاء"],["reports","التقارير"]];
const FLAGS=[["receive","قبض","تسجيل تحصيلات من المستأجرين"],["disburse","صرف","دفعات للملاك وصرف عمولات ومسحوبات الشركاء"],["approve","اعتماد المصروفات","مصروفاته تتعتمد تلقائياً ويقدر يعتمد أو يرفض مصروفات غيره"],["commissions","العمولات","يشوف ويعدل عمولات الموظفين وكشوفهم"],["all_cash","متابعة كل الخزن","يشوف أرصدة وحركة خزن كل المستخدمين (للمحاسب مثلاً)"]];
const LEVELS=[[0,"مخفية"],[1,"عرض فقط"],[2,"عرض وإضافة"],[3,"إضافة وتعديل"],[4,"كل الصلاحيات (مع الحذف)"]];
const allCash=()=>isAdmin()||flag("all_cash");
const ownerOnly=()=>!!(S.profile&&S.profile.owner_id&&!S.profile.is_admin&&!Object.keys((S.profile.perms||{}).screens||{}).length);
function visibleTabs(){if(ownerOnly())return [["myowner","كشف حسابي"]];
  const t=SCREENS.filter(([k])=>k==="employees"?lvl(k)>=1&&flag("commissions"):lvl(k)>=1);
  t.splice(t.length&&t[0][0]==="dash"?1:0,0,["cash",allCash()?"الخزن":"خزنتي"]);
  const ci=t.findIndex(x=>x[0]==="contracts");if(ci>=0)t.splice(ci+1,0,["calendar","التقويم"]);
  if(isAdmin())t.push(["users","المستخدمين"],["audit","سجل التعديلات"],["settings","الإعدادات"]);return t}
const myBox=()=>{const b=(S.L.cashboxes||[]).find(x=>x.user_id===S.user.id);return b?b.id:""};
const boxName=id=>{const b=(S.L.cashboxes||[]).find(x=>x.id===id);return b?b.name:"—"};
const boxOpts=()=>(S.L.cashboxes||[]).filter(b=>b.active).map(b=>[b.id,b.name]);
const boxField=()=>isAdmin()?[{k:"cashbox_id",label:"الخزنة",type:"select",req:1,opts:boxOpts,hint:"الخزنة اللي دخلت أو خرجت منها الفلوس"}]:[];

/* ---------- boot ---------- */
let sb=null;
async function boot(){
  if(!window.supabase||/PASTE_/.test(SUPABASE_URL+SUPABASE_KEY)){
    $("#app").innerHTML=`<div class="center"><div class="authbox"><h1>دفتر الشقق</h1><p>البرنامج محتاج يتربط بقاعدة البيانات. افتح ملف <b>index.html</b> وحط <b>Project URL</b> و<b>المفتاح</b> في أول الملف، زي ما هو مكتوب في دليل التركيب.</p>${!window.supabase?`<p class="err">لم يتم تحميل مكتبة Supabase — تأكد من الاتصال بالإنترنت.</p>`:""}</div></div>`;return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await sb.auth.getSession();
  if(session){S.user=session.user;await afterLogin()}else await showAuth();
}
async function showAuth(){
  let needSetup=false;try{needSetup=await q(sb.rpc("setup_needed"))}catch(e){toast(errMsg(e),1)}
  $("#app").innerHTML=`<div class="center"><form class="authbox" id="authF" novalidate><h1>دفتر الشقق</h1>
   ${needSetup?`<p class="sub" style="text-align:center">أول تشغيل: اعمل حساب <b>مدير النظام</b>. الحساب ده هيبقى ليه كل الصلاحيات.</p>
   <label class="f">اسمك<input id="a_name" autocomplete="name"></label>`:`<p class="sub" style="text-align:center">سجّل دخولك</p>`}
   <label class="f">اسم المستخدم (بالإنجليزي)<input id="a_user" autocomplete="username" autocapitalize="off" dir="ltr"></label>
   <label class="f">الباسورد<input id="a_pass" type="password" autocomplete="${needSetup?"new-password":"current-password"}" dir="ltr"></label>
   ${needSetup?`<label class="f">تأكيد الباسورد<input id="a_pass2" type="password" autocomplete="new-password" dir="ltr"></label>`:""}
   <div id="a_err" class="err"></div><button class="btn primary" id="a_btn">${needSetup?"إنشاء حساب المدير":"دخول"}</button></form></div>`;
  $("#authF").addEventListener("submit",async e=>{e.preventDefault();const u=$("#a_user").value.trim().toLowerCase(),p=$("#a_pass").value;const er=$("#a_err");er.textContent="";
    if(!u||!p){er.textContent="اكتب اسم المستخدم والباسورد";return}
    $("#a_btn").disabled=true;
    try{
      if(needSetup){if(p!==$("#a_pass2").value)throw new Error("الباسورد والتأكيد مش زي بعض");
        await q(sb.rpc("create_first_admin",{p_username:u,p_password:p,p_name:$("#a_name").value.trim()}))}
      const {data,error}=await sb.auth.signInWithPassword({email:u.includes("@")?u:u+EMAIL_DOMAIN,password:p});if(error)throw error;
      S.user=data.user;await afterLogin();
    }catch(err){er.textContent=errMsg(err);$("#a_btn").disabled=false}});
}
async function afterLogin(){
  try{S.profile=await q(sb.from("profiles").select("*").eq("id",S.user.id).maybeSingle())}catch(e){S.profile=null}
  if(!S.profile||!S.profile.active){$("#app").innerHTML=`<div class="center"><div class="authbox"><h1>دفتر الشقق</h1><p>الحساب ده موقوف أو مش موجود. كلم مدير النظام.</p><button class="btn" id="lo">خروج</button></div></div>`;
    $("#lo").onclick=logout;return}
  await refreshShared();
  const tabs=visibleTabs();if(!tabs.find(t=>t[0]===S.tab))S.tab=tabs.length?tabs[0][0]:"none";
  shell();await drawTab();
}
async function refreshShared(){
  try{S.L=await q(sb.rpc("lookups"))}catch(e){}
  try{const rows=await q(sb.from("app_settings").select("*"));rows.forEach(r=>S.settings[r.key]=r.value||{})}catch(e){}
  try{if(lvl("expenses")>=1||flag("approve")){const {count}=await sb.from("expenses").select("id",{count:"exact",head:true}).eq("status","pending");S.pendingCount=count||0}}catch(e){}
  try{if(lvl("maintenance")>=1){const {count}=await sb.from("maintenance").select("id",{count:"exact",head:true}).in("status",["open","in_progress"]);S.maintOpen=count||0}}catch(e){S.maintOpen=0}
  try{let qq=sb.from("cash_transfers").select("id",{count:"exact",head:true}).eq("status","pending");if(!isAdmin())qq=qq.eq("to_cashbox",myBox()||"00000000-0000-0000-0000-000000000000");const {count}=await qq;S.pendingTr=count||0}catch(e){S.pendingTr=0}
}
async function logout(){await sb.auth.signOut();location.reload()}

/* ---------- shell ---------- */
function shell(){
  const co=S.settings.company||{};
  $("#app").innerHTML=`<header class="top"><div class="top-in"><div class="brandrow">
    <div class="brand"><h1>دفتر الشقق</h1><span>${esc(co.name||"")}</span></div>
    <div class="period"><span>الفترة</span><input type="date" id="pFrom" value="${S.from}"><span>إلى</span><input type="date" id="pTo" value="${S.to}">
      <select id="pPreset" style="width:auto"><option value="">اختصار…</option><option value="m">هذا الشهر</option><option value="pm">الشهر السابق</option><option value="y">هذه السنة</option><option value="all">كل الفترات</option></select></div>
    <div class="userbox"><span>${esc(S.profile.full_name||S.profile.username)}${isAdmin()?' <span class="chip">مدير</span>':""}</span><button class="btn sm" data-act="account">حسابي</button><button class="btn sm" data-act="logout">خروج</button></div>
   </div><nav class="tabs" id="tabs" role="tablist"></nav></div></header><main id="main"></main>`;
  $("#pFrom").onchange=e=>{if(e.target.value){S.from=e.target.value;savePeriod()}};
  $("#pTo").onchange=e=>{if(e.target.value){S.to=e.target.value;savePeriod()}};
  $("#pPreset").onchange=e=>{const p=e.target.value;e.target.value="";if(!p)return;const d=new Date();
    if(p==="m"){S.from=iso(new Date(d.getFullYear(),d.getMonth(),1));S.to=iso(new Date(d.getFullYear(),d.getMonth()+1,0))}
    else if(p==="pm"){S.from=iso(new Date(d.getFullYear(),d.getMonth()-1,1));S.to=iso(new Date(d.getFullYear(),d.getMonth(),0))}
    else if(p==="y"){S.from=iso(new Date(d.getFullYear(),0,1));S.to=iso(new Date(d.getFullYear(),11,31))}
    else{S.from="2000-01-01";S.to="2100-12-31"}
    $("#pFrom").value=S.from;$("#pTo").value=S.to;savePeriod()};
  drawTabs();
}
function savePeriod(){store.set("dk.from",S.from);store.set("dk.to",S.to);drawTab()}
function drawTabs(){$("#tabs").innerHTML=visibleTabs().map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.tab===k}" data-act="tab" data-tab="${k}">${l}${k==="expenses"&&S.pendingCount&&flag("approve")?`<span class="badge">${S.pendingCount}</span>`:""}${k==="cash"&&S.pendingTr?`<span class="badge">${S.pendingTr}</span>`:""}${k==="maintenance"&&S.maintOpen?`<span class="badge" style="background:var(--warn)">${S.maintOpen}</span>`:""}</button>`).join("")}
let drawSeq=0;
async function drawTab(){const seq=++drawSeq;const m=$("#main");if(!m)return;
  if(!V[S.tab]){m.innerHTML=`<div class="panel"><h3>مفيش شاشات متاحة لحسابك</h3><p class="sub">كلم مدير النظام يديك صلاحيات.</p></div>`;return}
  if(!m.innerHTML.trim())m.innerHTML=`<div class="loading">جاري التحميل…</div>`;
  try{const html=await V[S.tab]();if(seq===drawSeq)m.innerHTML=html}
  catch(e){if(seq===drawSeq)m.innerHTML=`<div class="banner">تعذر التحميل: ${esc(errMsg(e))} <button class="btn sm" data-act="reload">إعادة المحاولة</button></div>`}}
async function reloadAll(){await refreshShared();drawTabs();await drawTab()}

/* ---------- modal ---------- */
function modal(html,wide){closeModal();const s=document.createElement("div");s.className="scrim";s.innerHTML=`<div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener("click",e=>{if(e.target===s||e.target.closest("[data-close]"))closeModal()});$("#modalRoot").appendChild(s);document.body.style.overflow="hidden";
  const f=s.querySelector("input:not([type=hidden]):not([disabled]),select,textarea");if(f)f.focus({preventScroll:true});return s.querySelector(".modal")}
function closeModal(){$("#modalRoot").innerHTML="";document.body.style.overflow=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function confirmBox(msg,onYes,note){const m=modal(`<h3>${esc(msg)}</h3><p class="sub">${esc(note||"الحذف نهائي ولا يمكن التراجع عنه.")}</p><div class="btns"><button class="btn primary" id="cy" style="background:var(--neg);border-color:var(--neg)">نعم</button><button class="btn" data-close>إلغاء</button></div>`);
  m.querySelector("#cy").onclick=()=>{closeModal();onYes()}}

/* ---------- generic form ---------- */
const optsL=(k,empty)=>()=>[...(empty?[["",empty]]:[]),...(S.L[k]||[]).map(x=>[x.id,x.name])];
function formModal({title,fields,values,wide,onSave,extraHtml,afterRender}){
  const v=Object.assign({},values||{});
  const fh=f=>{const {k,label,type="text",req,opts,full,hint}=f;const val=v[k]??"";let inp;
    if(type==="select")inp=`<select id="f_${k}">${opts().map(([o,t])=>`<option value="${esc(o)}" ${String(o)===String(val)?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
    else if(type==="textarea")inp=`<textarea id="f_${k}">${esc(val)}</textarea>`;
    else if(type==="custom")return `<div style="grid-column:1/-1" id="f_${k}"></div>`;
    else if(type==="hidden")return `<input type="hidden" id="f_${k}" value="${esc(val)}">`;
    else inp=`<input id="f_${k}" type="${type}" ${type==="number"?'step="any" inputmode="decimal" dir="ltr"':""} value="${esc(val)}">`;
    return `<label class="f" ${full||type==="textarea"?'style="grid-column:1/-1"':""}>${label}${req?" *":""}${inp}${hint?`<span class="sub">${hint}</span>`:""}</label>`};
  const m=modal(`<div class="modal-h"><h3>${title}</h3><button class="btn sm" data-close>إغلاق</button></div>
    <form id="frm" class="grid2" novalidate>${fields.map(fh).join("")}</form>${extraHtml||""}<div id="ferr" class="err"></div>
    <div class="btns"><button class="btn primary" id="fsave">حفظ</button><button class="btn" data-close>إلغاء</button></div>`,wide);
  const g=k=>m.querySelector("#f_"+k);
  if(afterRender)afterRender(m,g);
  m.querySelector("#frm").addEventListener("submit",e=>e.preventDefault());
  m.querySelector("#fsave").onclick=async()=>{const out={};const errs=[];
    fields.forEach(f=>{if(f.type==="custom")return;let x=g(f.k).value;if(typeof x==="string")x=x.trim();if(f.type==="number")x=x===""?null:+x;if(x==="")x=null;out[f.k]=x;if(f.req&&(x===null||x===undefined))errs.push(f.label)});
    const er=m.querySelector("#ferr");if(errs.length){er.textContent="اكمل: "+errs.join("، ");return}
    const btn=m.querySelector("#fsave");btn.disabled=true;er.textContent="";
    try{const r=await onSave(out,m);if(r===false){btn.disabled=false;return}closeModal();toast("تم الحفظ");await reloadAll();if(r&&r.after)r.after()}
    catch(e){er.textContent=errMsg(e);btn.disabled=false}};
  return m;
}
async function saveRow(table,id,row){
  if(id){const d=await q(sb.from(table).update(row).eq("id",id).select("id"));if(!d.length)throw new Error("ليس لديك صلاحية تعديل هذا السجل");return id}
  const d=await q(sb.from(table).insert(row).select("id").single());return d.id}
async function delRow(table,id){try{const d=await q(sb.from(table).delete().eq("id",id).select("id"));if(!d.length)throw new Error("ليس لديك صلاحية حذف هذا السجل");toast("تم الحذف");await reloadAll()}catch(e){toast(errMsg(e),1)}}

/* ---------- periods editor (ملكية / شركاء) ---------- */
function periodsEditor(el,P,pool){
  const key=pool==="owners"?"owner_id":"partner_id";const who=pool==="owners"?"مالك":"شريك";
  if(!P.length)P.push({from:"2020-01-01",shares:[{[key]:"",pct:100}]});
  const sumOf=p=>r2(p.shares.reduce((s,x)=>s+(+x.pct||0),0));
  const draw=()=>{P.sort((a,b)=>(a.from||"")<(b.from||"")?-1:1);
    el.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px">${P.map((p,i)=>{const sum=sumOf(p);
      return `<div class="period-box"><div class="btns" style="justify-content:space-between"><label class="f" style="flex-direction:row;align-items:center;gap:8px">سارية من <input type="date" data-pi="${i}" data-pk="from" value="${esc(p.from)}" style="width:160px"></label>${P.length>1?`<button type="button" class="btn sm danger" data-pdel="${i}">حذف الفترة</button>`:""}</div>
      ${p.shares.map((s,j)=>`<div class="srow"><select data-pi="${i}" data-sj="${j}" data-sk="${key}"><option value="">— اختر ${who} —</option>${(S.L[pool]||[]).map(o=>`<option value="${o.id}" ${o.id===s[key]?"selected":""}>${esc(o.name)}</option>`).join("")}</select>
        <input type="number" step="any" inputmode="decimal" dir="ltr" data-pi="${i}" data-sj="${j}" data-sk="pct" value="${esc(s.pct)}" placeholder="%"><button type="button" class="btn sm" data-sdel="${i}:${j}" aria-label="حذف السطر">✕</button></div>`).join("")}
      <div class="btns" style="justify-content:space-between"><button type="button" class="btn sm" data-sadd="${i}">+ ${who}</button><span class="sumline sub ${sum===100?"pos":"neg"}">المجموع ${sum}%${sum===100?"":" — لازم 100%"}</span></div></div>`}).join("")}
      <div><button type="button" class="btn sm" data-padd>+ تغيير النسب من تاريخ جديد</button> <span class="sub">لما ${who} يبيع نصيبه أو النسب تتغير، أضف فترة جديدة بدل ما تعدل القديمة، عشان حسابات الشهور اللي فاتت تفضل صح.</span></div>
      ${!(S.L[pool]||[]).length?`<div class="err">أضف ${pool==="owners"?"الملاك":"الشركاء"} الأول من شاشتهم.</div>`:""}</div>`};
  el.addEventListener("input",e=>{const t=e.target;if(t.dataset.pi==null)return;const p=P[+t.dataset.pi];
    if(t.dataset.pk)p.from=t.value;else p.shares[+t.dataset.sj][t.dataset.sk]=t.dataset.sk==="pct"?(t.value===""?"":+t.value):t.value;
    if(t.dataset.sk==="pct"){const sum=sumOf(p);const sl=t.closest(".period-box").querySelector(".sumline");sl.className="sumline sub "+(sum===100?"pos":"neg");sl.textContent=`المجموع ${sum}%${sum===100?"":" — لازم 100%"}`}});
  el.addEventListener("change",e=>{if(e.target.dataset.pk)draw()});
  el.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
    if(t.dataset.sadd!=null){P[+t.dataset.sadd].shares.push({[key]:"",pct:""});draw()}
    else if(t.dataset.sdel){const [i,j]=t.dataset.sdel.split(":").map(Number);P[i].shares.splice(j,1);if(!P[i].shares.length)P[i].shares.push({[key]:"",pct:""});draw()}
    else if(t.dataset.pdel!=null){P.splice(+t.dataset.pdel,1);draw()}
    else if(t.dataset.padd!=null){P.push({from:today(),shares:clone(P[P.length-1].shares)});draw()}});
  draw();
}
function checkPeriods(P,key){for(const p of P){if(!p.from)return "تاريخ بداية كل فترة";const ids=p.shares.map(s=>s[key]);
  if(ids.some(x=>!x))return "اختيار الاسم في كل سطر";if(new Set(ids).size!==ids.length)return "نفس الاسم متكرر في فترة واحدة";
  if(r2(p.shares.reduce((s,x)=>s+(+x.pct||0),0))!==100)return "مجموع النسب 100% في كل فترة"}return ""}
function sharesAt(periods,date){const ps=(periods||[]).filter(p=>p.from).slice().sort((a,b)=>a.from<b.from?-1:1);if(!ps.length)return [];let c=ps[0];for(const p of ps)if(p.from<=date)c=p;return c.shares||[]}

/* ---------- tables ---------- */
function table(heads,rows,foot){if(!rows.length)return `<div class="tbl-wrap"><div class="empty">لا توجد بيانات</div></div>`;
  return `<div class="tbl-wrap"><table><thead><tr>${heads.map(h=>`<th class="${h[1]||""}">${h[0]}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody>${foot?`<tfoot><tr>${foot}</tr></tfoot>`:""}</table></div>`}
const rowBtnsLite=(t,id,more)=>`<td><div class="btns">${more}</div></td>`;
const rowBtns=(screen,t,id,more="")=>{const b=[more];if(lvl(screen)>=3)b.push(`<button class="btn sm" data-act="edit" data-t="${t}" data-id="${id}">تعديل</button>`);if(lvl(screen)>=4)b.push(`<button class="btn sm danger" data-act="del" data-t="${t}" data-id="${id}">حذف</button>`);return `<td><div class="btns">${b.join("")}</div></td>`};
const total=c=>r2((+c.unit_price||0)*(+c.units||0));
function statusOf(c){const t=today();if(c.end_date<t)return ["منتهي","gray"];if(c.start_date>t)return ["قادم","warn"];return ["سارٍ",""]}

     <div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th class="amt">له</th><th class="amt">عليه</th><th class="amt">الرصيد</th><th></th></tr></thead><tbody>

    afterRender:(m,g)=>{

      if(showComm)g("employee_id").addEventListener("change",()=>{const e=emps.find(x=>x.id===g("employee_id").value);g("comm_pct").value=e?+e.default_pct:"";recalc()});

      g("tenant_pick").addEventListener("change",()=>{const t=tenants.find(x=>x.id===g("tenant_pick").value);g("tenant_id").value=t?t.id:"";

    onSave:async out=>{if(out.end_date<out.start_date)throw new Error("تاريخ النهاية قبل البداية");
      const commPct=out.comm_pct;delete out.comm_pct;delete out.tenant_pick;if(!showComm)delete out.employee_id;

        else await q(sb.from("contract_commissions").delete().eq("contract_id",id))}}});

const METHODS=()=>["كاش","تحويل بنكي","إنستاباي","محفظة إلكترونية","شيك"].map(x=>[x,x]);
const FEE_TYPES=["نظافة","كهرباء","مياه","غاز","إنترنت","عمولة (سمسرة)","خدمات إضافية","تلفيات","أخرى"];
function tafqeet(n){n=r2(Math.abs(n));const g=Math.floor(n+1e-9),p=Math.round((n-g)*100);
  const ones=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
  const tens=["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
  const hund=["","مائة","مائتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];
  const u100=x=>x<20?ones[x]:(x%10?ones[x%10]+" و":"")+tens[Math.floor(x/10)];
  const u1000=x=>[hund[Math.floor(x/100)],x%100?u100(x%100):""].filter(Boolean).join(" و");
  const sc=(c,f)=>c===1?f[0]:c===2?f[1]:(c%100>=3&&c%100<=10?u1000(c)+" "+f[2]:u1000(c)+" "+f[0]);
  const parts=[];const B=Math.floor(g/1e9),M=Math.floor(g/1e6)%1000,T=Math.floor(g/1000)%1000,U=g%1000;
  if(B)parts.push(sc(B,["مليار","ملياران","مليارات"]));if(M)parts.push(sc(M,["مليون","مليونان","ملايين"]));
  if(T)parts.push(sc(T,["ألف","ألفان","آلاف"]));if(U)parts.push(u1000(U));
  let out=(parts.join(" و")||"صفر")+" جنيه مصري";if(p)out+=" و"+u100(p)+" قرش";return "فقط "+out+" لا غير"}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

  if(kind==="fee"){const f=await q(sb.from("fees").select("*").eq("id",id).single());

    return {title:inn?"إيصال استلام تأمين":"سند رد تأمين",no:"D-"+d.no,date:d.date,amount:d.amount,box:boxName(d.cashbox_id),by:lname("users",d.created_by),

      note:inn?"مبلغ التأمين أمانة لدى الشركة، ويُرد عند انتهاء العقد بعد استلام الشقة ومحتوياتها وخصم أي تلفيات أو مستحقات.":"",
      sigs:inn?["المستلم<br>"+esc(lname("users",d.created_by)),"توقيع الدافع"]:["الصارف<br>"+esc(lname("users",d.created_by)),"توقيع المستلم"]}}
  if(kind==="payout"){const p=await q(sb.from("payouts").select("*").eq("id",id).single());const col={owner:"owners",employee:"employees",partner:"partners"}[p.kind];
    const lbl={owner:"دفعة من مستحقات المالك",employee:"صرف عمولة",partner:"مسحوبات شريك"}[p.kind];
    return {title:"سند صرف نقدية",no:"P-"+p.no,date:p.date,amount:p.amount,box:boxName(p.cashbox_id),by:lname("users",p.created_by),
      rows:[["صرفنا للسيد/",esc(lname(col,p.person_id))],["وذلك قيمة",esc(lbl)],...(p.note?[["ملاحظة",esc(p.note)]]:[])],sigs:["الصارف<br>"+esc(lname("users",p.created_by)),"توقيع المستلم"]}}
  if(kind==="transfer"){const t=await q(sb.from("cash_transfers").select("*").eq("id",id).single());
    const st={pending:"في انتظار تأكيد الاستلام",confirmed:"تم الاستلام",rejected:"مرفوض"}[t.status];
    return {title:"سند تحويل نقدية بين الخزن",no:"T-"+t.no,date:t.date,amount:t.amount,by:lname("users",t.created_by),

      sigs:["المُسلِّم<br>"+esc(boxName(t.from_cashbox)),"المستلم<br>"+esc(boxName(t.to_cashbox))]}}
}

function exportCsv(name,cols,rows,foot){const e2=v=>{v=v==null?"":String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const val=(v,i)=>typeof v==="number"&&cols[i].t==="money"?r2(v):v;

/* ---------- v3: dates, installments, whatsapp ---------- */
const addDays=(d,n)=>{const x=new Date(d+"T00:00");x.setDate(x.getDate()+n);return iso(x)};
const addMonths=(d,n)=>{const x=new Date(d+"T00:00");const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return iso(x)};
function schedule(c,paid){const t=today();const tot=r2((+c.unit_price||0)*(+c.units||0));let rows=[];
  if(c.rent_type==="daily")rows=[{i:1,due:c.start_date,amount:tot}];
  else{const u=+c.units||0,full=Math.floor(u+1e-9);for(let i=0;i<full;i++)rows.push({i:i+1,due:addMonths(c.start_date,i),amount:+c.unit_price});
    const rest=r2(tot-full*(+c.unit_price));if(rest>0.5)rows.push({i:full+1,due:addMonths(c.start_date,full),amount:rest})}
  let left=+paid||0;rows.forEach(r=>{r.paid=r2(Math.min(left,r.amount));left=r2(left-r.paid);r.rem=r2(r.amount-r.paid);
    r.st=r.rem<=0.5?"paid":r.due<t?"late":dayDiff(t,r.due)<=7?"soon":"later"});
  return rows}
const ST_CHIP={paid:["مدفوع",""],late:["متأخر","neg"],soon:["مستحق قريب","warn"],later:["لسه","gray"]};
function waPhone(p){let d=String(p||"").replace(/[^\d]/g,"");if(!d)return "";if(d.startsWith("00"))d=d.slice(2);else if(d.startsWith("0")&&d.length===11)d="2"+d;else if(d.length===10&&d.startsWith("1"))d="20"+d;return d.length>=10?d:""}
const waUrl=(phone,text)=>{const p=waPhone(phone);return p?`https://wa.me/${p}?text=${encodeURIComponent(text)}`:""};
const waBtn=(phone,text,label="واتساب")=>{const u=waUrl(phone,text);return u?`<a class="btn sm wa" href="${u}" target="_blank" rel="noopener">${label}</a>`:`<span class="sub" title="مفيش رقم تليفون">—</span>`};
function reminderText(c,r){const co=CO().name;const apt=lname("apartments",c.apt_id);
  return r.st==="late"?`السلام عليكم أ/ ${c.tenant_name}\nنحيط حضرتك علماً إن قسط إيجار ${apt} المستحق بتاريخ ${r.due} بمبلغ ${moneyT(r.rem)} لسه متسددش.\nبرجاء السداد في أقرب وقت. شكراً لحضرتك.\n${co}`
    :`السلام عليكم أ/ ${c.tenant_name}\nنذكّر حضرتك بقسط إيجار ${apt} المستحق بتاريخ ${r.due} بمبلغ ${moneyT(r.rem)}.\nشكراً لحضرتك.\n${co}`}
async function dueList(days){const [cs,paid]=await Promise.all([q(sb.from("contracts").select("id,no,apt_id,tenant_name,tenant_phone,rent_type,start_date,end_date,unit_price,units")),paidMap()]);const out=[];
  cs.forEach(c=>schedule(c,paid[c.id]||0).forEach(r=>{if(r.rem>0.5&&(r.st==="late"||dayDiff(today(),r.due)<=days))out.push({c,r})}));
  return out.sort((a,b)=>a.r.due<b.r.due?-1:1)}

     <td><div class="btns">${r.rem>0.5?waBtn(c.tenant_phone,reminderText(c,r),"تذكير واتساب"):""}${r.rem>0.5&&canPay?`<button class="btn sm" data-act="payInst" data-id="${c.id}" data-amt="${r.rem}">تحصيل</button>`:""}</div></td></tr>`).join("")}
   </tbody></table></div>${!waPhone(c.tenant_phone)?`<p class="sub">مفيش رقم تليفون صحيح للمستأجر، فزرار الواتساب مش هيظهر. ضيفه من تعديل العقد.</p>`:""}`,1);

function fileToData(f){return new Promise((res,rej)=>{
  if(f.type==="application/pdf"){if(f.size>1400000)return rej(new Error("ملف الـ PDF كبير (أكتر من 1.4 ميجا). صوّره كصورة بدل كده"));const r=new FileReader();r.onload=()=>res({mime:f.type,data:r.result,size:f.size});r.onerror=()=>rej(new Error("تعذر قراءة الملف"));r.readAsDataURL(f);return}
  if(!f.type.startsWith("image/"))return rej(new Error("مسموح بصور أو PDF بس"));
  const img=new Image();const u=URL.createObjectURL(f);img.onload=()=>{const max=1400;let w=img.width,h=img.height;if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(u);const data=c.toDataURL("image/jpeg",0.75);res({mime:"image/jpeg",data,size:Math.round(data.length*0.75)})};
  img.onerror=()=>rej(new Error("تعذر قراءة الصورة"));img.src=u})}
async function viewDoc(id){const w=window.open("","_blank");try{const d=await q(sb.from("attachments").select("*").eq("id",id).single());
  if(!w){toast("المتصفح منع فتح نافذة جديدة",1);return}
  if(d.mime.startsWith("image/")){w.document.write(`<!doctype html><title>${esc(d.name)}</title><body style="margin:0;background:#222;display:flex;justify-content:center"><img src="${d.data}" style="max-width:100%"></body>`);w.document.close()}
  else{const b=await (await fetch(d.data)).blob();w.location.href=URL.createObjectURL(b)}}catch(e){if(w)w.close();toast(errMsg(e),1)}}

function auditVal(k,v){if(v==null||v==="")return "—";if(k.endsWith("cashbox")||k==="cashbox_id")return boxName(v);if(k==="apt_id")return lname("apartments",v);if(k==="employee_id")return lname("employees",v);if(k==="assigned_to")return lname("users",v);

  else if(act==="mDone")maintDone((cache.maint||[]).find(x=>x.id===id));
  else if(act==="countNew")countForm();
  else if(act==="countSettle"){const d=+b.dataset.diff;confirmBox(`تسوية ${d<0?"عجز":"زيادة"} ${moneyT(Math.abs(d))}؟`,async()=>{try{const r=await q(sb.from("cash_counts").update({status:"settled"}).eq("id",id).select("id"));if(!r.length)throw new Error("ليس لديك صلاحية");toast("تمت التسوية");await reloadAll()}catch(err){toast(errMsg(err),1)}},"الرصيد في البرنامج هيتعدل عشان يطابق اللي اتعدّ فعلاً. لو العجز على الموظف سجّله بعد كده كمصروف أو خصم.")}
  else if(act==="saveLock"){const v=$("#s_lock").value;if(!v){toast("اختار التاريخ",1);return}confirmBox(`قفل كل الحسابات لحد ${v}؟`,async()=>{try{await q(sb.from("app_settings").update({value:{until:v}}).eq("key","lock"));toast("تم القفل");await reloadAll()}catch(err){toast(errMsg(err),1)}},"الموظفين مش هيقدروا يضيفوا أو يعدّلوا أي حاجة قبل التاريخ ده. انت (المدير) هتقدر.")}
  else if(act==="clearLock"){await q(sb.from("app_settings").update({value:{}}).eq("key","lock"));toast("اتلغى القفل");await reloadAll()}
  else if(act==="newFee")await openFee(null);
  else if(act==="feeFor")await openFee(null,id);
  else if(act==="deposits")await openDeposits(id);
  else if(act==="newTransfer")transferForm();
  else if(act==="newBox")await boxForm(null);
  else if(act==="editBox")await boxForm(id);
  else if(act==="selBox"){S.sel.box=id;await drawTab();const st=$("#stmt");st&&st.scrollIntoView({block:"start"})}
  else if(act==="trOk"){const t=(cache.transfers||[]).find(x=>x.id===id);confirmBox(`تأكيد استلام ${moneyT(t.amount)} من ${boxName(t.from_cashbox)}؟`,async()=>{try{const d=await q(sb.from("cash_transfers").update({status:"confirmed"}).eq("id",id).select("id"));if(!d.length)throw new Error("ليس لديك صلاحية التأكيد");toast("تم تأكيد الاستلام");await reloadAll()}catch(err){toast(errMsg(err),1)}},"اتأكد إنك عدّيت المبلغ واستلمته فعلاً. بعد التأكيد مينفعش ترجع فيه.")}
  else if(act==="trNo"){formModal({title:"رفض التحويل",fields:[{k:"reason",label:"سبب الرفض",full:1,req:1}],onSave:async out=>{const d=await q(sb.from("cash_transfers").update({status:"rejected",reject_reason:out.reason}).eq("id",id).select("id"));if(!d.length)throw new Error("ليس لديك صلاحية")}})}
  else if(act==="trCancel"){confirmBox("إلغاء التحويل ده؟",()=>delRow("cash_transfers",id),"التحويل لسه متأكدش، فالإلغاء مش هيأثر على أي رصيد.")}
  else if(act==="boxPrint"||act==="boxCsv"){const {box,mv}=cache.boxStmt;let bal=+box.opening;const cols=[{h:"التاريخ"},{h:"المستند"},{h:"البيان"},{h:"وارد",t:"money"},{h:"منصرف",t:"money"},{h:"الرصيد",t:"money"},{h:"بواسطة"}];
    const rows=[[S.from,"","رصيد أول المدة","","",+box.opening,""],...mv.map(x=>{bal+=+x.amount;return [x.d,x.doc,x.descr,x.amount>0?+x.amount:"",x.amount<0?-x.amount:"",r2(bal),x.by_name||""]})];
    const r={title:"حركة "+box.name,cols,rows,foot:["الإجمالي","","",+box.inc,-box.outg,+box.closing,""]};
    if(act==="boxPrint")printHtml(r.title,reportPrintHtml(r));else exportCsv(`shoqaq-cashbox-${S.from}_${S.to}`,cols,rows,r.foot)}
  else if(act==="repPrint"){const r=cache.report;printHtml(r.title,reportPrintHtml(r))}
  else if(act==="repCsv"){const r=cache.report;exportCsv(`shoqaq-${S.rep}-${S.from}_${S.to}`,r.cols,r.rows,r.foot)}
  else if(act==="newUser")userForm(null);
  else if(act==="editUser")userForm((cache.users||[]).find(x=>x.id===id));
  else if(act==="resetPw"){const u=(cache.users||[]).find(x=>x.id===id);formModal({title:`باسورد جديد لـ ${esc(u.full_name||u.username)}`,fields:[{k:"pw",label:"الباسورد الجديد",req:1}],onSave:async out=>{await q(sb.rpc("admin_set_password",{p_uid:id,p_password:out.pw}))}})}
  else if(act==="delUser"){const u=(cache.users||[]).find(x=>x.id===id);confirmBox(`حذف المستخدم ${u.full_name||u.username}؟`,async()=>{try{await q(sb.rpc("admin_delete_user",{p_uid:id}));toast("تم الحذف");await reloadAll()}catch(err){toast(errMsg(err),1)}},"هيتمنع من الدخول نهائياً. العمليات اللي سجلها هتفضل موجودة. لو عايز توقفه مؤقتاً استخدم \"الحساب مفعّل\" بدل الحذف.")}
  else if(act==="saveCompany"){const o={};["name","rep","cr","city","address","payDays","kwh"].forEach(k=>o[k]=$("#s_"+k).value.trim());await q(sb.from("app_settings").update({value:o}).eq("key","company"));toast("تم الحفظ");await reloadAll();shell();await drawTab()}
  else if(act==="backup"){const out={exported:new Date().toISOString()};for(const tb of ["app_settings","owners","apartments","employees","partners","contracts","contract_commissions","payments","fees","deposits","expenses","payouts","cashboxes","cash_transfers","cash_counts","tenants","attachments","maintenance","apt_items","handovers","profiles"])out[tb]=await q(sb.from(tb).select("*"));
    downloadBlob(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}),`shoqaq-backup-${today()}.json`);toast("تم تحميل النسخة")}
  }catch(err){toast(errMsg(err),1)}
});

boot().catch(e=>{$("#app").innerHTML=`<div class="center"><div class="authbox"><h1>دفتر الشقق</h1><p class="err">${esc(errMsg(e))}</p></div></div>`});
})();
</script>
</body>
</html>
