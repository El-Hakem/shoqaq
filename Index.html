<style>

}}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.top-in{max-width:1200px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--neg);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-inline-start:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0;text-wrap:balance}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700}
.tile.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.hero .l{color:var(--accent-ink);opacity:.85}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.wrap{white-space:normal;min-width:180px}

tr:last-child td{border-bottom:0}

.amt{text-align:left}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.chip.copper{background:var(--copper-soft);color:var(--copper)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.neg{background:var(--neg-soft);color:var(--neg)}
.chip.gray{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:7px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--neg)}
.btn.sm{padding:3px 10px;font-size:13px;font-weight:500}
.btn.link{border:0;background:none;padding:2px 4px;color:var(--accent);font-weight:500}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink)}
label.chk input{width:auto;margin-top:5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.banner{padding:10px 14px;border-radius:8px;font-size:14px;background:var(--warn-soft);color:var(--warn);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--muted)}
.inl{display:flex;flex-wrap:wrap;gap:4px}
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:680px;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal.wide{max-width:880px}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.period-box{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.srow{display:grid;grid-template-columns:1fr 90px auto;gap:6px;align-items:center}

.doc .dmeta{text-align:center;color:#555;font-size:13px;margin-bottom:16px}
.doc h4{margin:16px 0 4px;font-size:15px}
.doc ol{padding-right:20px;margin:4px 0}
.doc th{background:#f3f3f3;color:#333}.doc td,.doc th{border:1px solid #ccc;white-space:normal}
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:24px;margin-top:36px}
.sigs div{border-top:1px solid #999;padding-top:6px;text-align:center;font-size:14px}
.center{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:16px}
.authbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.authbox h1{font-family:var(--f-display);color:var(--accent);margin:0;font-size:30px;text-align:center}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:80;max-width:90vw;text-align:center}
.toast.bad{background:var(--neg);color:#fff}
.loading{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:560px){.brand h1{font-size:20px}.period input{width:124px}.tile .v{font-size:19px}.doc{padding:18px}.permgrid{grid-template-columns:1fr 150px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div id="app"><div class="loading">جاري التحميل…</div></div>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const fmtN=n=>r2(n).toLocaleString("en-US",{maximumFractionDigits:2});
const money=n=>`<span class="num">${fmtN(n)}</span> ج.م`;
const moneyT=n=>fmtN(n)+" ج.م";
const sgn=n=>`<span class="${r2(n)<0?"neg":r2(n)>0?"pos":""}">${money(n)}</span>`;
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const dStr=s=>s?`<span class="num">${esc(s)}</span>`:"—";
const dayDiff=(a,b)=>Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const clone=o=>JSON.parse(JSON.stringify(o));
const EMAIL_DOMAIN="@shoqaq.app";
function toast(t,bad){const el=document.createElement("div");el.className="toast"+(bad?" bad":"");el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),bad?4500:2600)}
function errMsg(e){const m=(e&&(e.message||e.error_description||e.msg))||String(e||"");
  if(/row-level security|permission denied/i.test(m))return "ليس لديك صلاحية لهذه العملية";
  if(/foreign key/i.test(m))return "لا يمكن الحذف لوجود بيانات مرتبطة بيه (مثلاً تحصيلات على العقد أو عقود على الشقة)";
  if(/duplicate key.*no|contracts_no_key/i.test(m))return "رقم العقد ده موجود قبل كده";
  if(/duplicate key/i.test(m))return "القيمة دي موجودة قبل كده";
  if(/Invalid login credentials/i.test(m))return "اسم المستخدم أو الباسورد غلط";
  if(/Failed to fetch|NetworkError/i.test(m))return "مفيش اتصال بالإنترنت أو السيرفر متوقف";
  if(/check constraint/i.test(m))return "فيه قيمة غير مسموحة، راجع البيانات";
  return m}
async function q(p){const {data,error}=await p;if(error)throw error;return data}

/* ---------- state ---------- */
const S={user:null,profile:null,L:{apartments:[],owners:[],employees:[],partners:[],users:[]},settings:{company:{},partner_shares:{periods:[]}},
  tab:store.get("dk.tab")||"dash",from:store.get("dk.from")||"",to:store.get("dk.to")||"",sel:{},pendingCount:0};
if(!S.from||!S.to){const d=new Date();S.from=iso(new Date(d.getFullYear(),d.getMonth(),1));S.to=iso(new Date(d.getFullYear(),d.getMonth()+1,0))}
const isAdmin=()=>!!(S.profile&&S.profile.is_admin);
const lvl=s=>isAdmin()?4:+((S.profile&&S.profile.perms&&S.profile.perms.screens&&S.profile.perms.screens[s])||0);
const flag=f=>isAdmin()||!!(S.profile&&S.profile.perms&&S.profile.perms[f]);
const lname=(k,id)=>{const x=(S.L[k]||[]).find(o=>o.id===id);return x?x.name:"—"};
const inP=d=>d>=S.from&&d<=S.to;

const SCREENS=[["dash","الملخص"],["contracts","العقود"],["payments","التحصيلات"],["expenses","المصروفات"],["apartments","الشقق"],["owners","الملاك"],["employees","الموظفين"],["partners","الشركاء"]];
const FLAGS=[["receive","قبض","تسجيل تحصيلات من المستأجرين"],["disburse","صرف","دفعات للملاك وصرف عمولات ومسحوبات الشركاء"],["approve","اعتماد المصروفات","مصروفاته تتعتمد تلقائياً ويقدر يعتمد أو يرفض مصروفات غيره"],["commissions","العمولات","يشوف ويعدل عمولات الموظفين وكشوفهم"]];
const LEVELS=[[0,"مخفية"],[1,"عرض فقط"],[2,"عرض وإضافة"],[3,"إضافة وتعديل"],[4,"كل الصلاحيات (مع الحذف)"]];
function visibleTabs(){const t=SCREENS.filter(([k])=>k==="employees"?lvl(k)>=1&&flag("commissions"):lvl(k)>=1);
  if(isAdmin())t.push(["users","المستخدمين"],["settings","الإعدادات"]);return t}

/* ---------- boot ---------- */
let sb=null;
async function boot(){
  if(!window.supabase||/PASTE_/.test(SUPABASE_URL+SUPABASE_KEY)){
    $("#app").innerHTML=`<div class="center"><div class="authbox"><h1>دفتر الشقق</h1><p>البرنامج محتاج يتربط بقاعدة البيانات. افتح ملف <b>index.html</b> وحط <b>Project URL</b> و<b>المفتاح</b> في أول الملف، زي ما هو مكتوب في دليل التركيب.</p>${!window.supabase?`<p class="err">لم يتم تحميل مكتبة Supabase — تأكد من الاتصال بالإنترنت.</p>`:""}</div></div>`;return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await sb.auth.getSession();
  if(session){S.user=session.user;await afterLogin()}else await showAuth();
}
async function showAuth(){
  let needSetup=false;try{needSetup=await q(sb.rpc("setup_needed"))}catch(e){toast(errMsg(e),1)}
  $("#app").innerHTML=`<div class="center"><form class="authbox" id="authF" novalidate><h1>دفتر الشقق</h1>
   ${needSetup?`<p class="sub" style="text-align:center">أول تشغيل: اعمل حساب <b>مدير النظام</b>. الحساب ده هيبقى ليه كل الصلاحيات.</p>
   <label class="f">اسمك<input id="a_name" autocomplete="name"></label>`:`<p class="sub" style="text-align:center">سجّل دخولك</p>`}
   <label class="f">اسم المستخدم (بالإنجليزي)<input id="a_user" autocomplete="username" autocapitalize="off" dir="ltr"></label>
   <label class="f">الباسورد<input id="a_pass" type="password" autocomplete="${needSetup?"new-password":"current-password"}" dir="ltr"></label>
   ${needSetup?`<label class="f">تأكيد الباسورد<input id="a_pass2" type="password" autocomplete="new-password" dir="ltr"></label>`:""}
   <div id="a_err" class="err"></div><button class="btn primary" id="a_btn">${needSetup?"إنشاء حساب المدير":"دخول"}</button></form></div>`;
  $("#authF").addEventListener("submit",async e=>{e.preventDefault();const u=$("#a_user").value.trim().toLowerCase(),p=$("#a_pass").value;const er=$("#a_err");er.textContent="";
    if(!u||!p){er.textContent="اكتب اسم المستخدم والباسورد";return}
    $("#a_btn").disabled=true;
    try{
      if(needSetup){if(p!==$("#a_pass2").value)throw new Error("الباسورد والتأكيد مش زي بعض");
        await q(sb.rpc("create_first_admin",{p_username:u,p_password:p,p_name:$("#a_name").value.trim()}))}
      const {data,error}=await sb.auth.signInWithPassword({email:u.includes("@")?u:u+EMAIL_DOMAIN,password:p});if(error)throw error;
      S.user=data.user;await afterLogin();
    }catch(err){er.textContent=errMsg(err);$("#a_btn").disabled=false}});
}
async function afterLogin(){
  try{S.profile=await q(sb.from("profiles").select("*").eq("id",S.user.id).maybeSingle())}catch(e){S.profile=null}
  if(!S.profile||!S.profile.active){$("#app").innerHTML=`<div class="center"><div class="authbox"><h1>دفتر الشقق</h1><p>الحساب ده موقوف أو مش موجود. كلم مدير النظام.</p><button class="btn" id="lo">خروج</button></div></div>`;
    $("#lo").onclick=logout;return}
  await refreshShared();
  const tabs=visibleTabs();if(!tabs.find(t=>t[0]===S.tab))S.tab=tabs.length?tabs[0][0]:"none";
  shell();await drawTab();
}
async function refreshShared(){
  try{S.L=await q(sb.rpc("lookups"))}catch(e){}
  try{const rows=await q(sb.from("app_settings").select("*"));rows.forEach(r=>S.settings[r.key]=r.value||{})}catch(e){}
  try{if(lvl("expenses")>=1||flag("approve")){const {count}=await sb.from("expenses").select("id",{count:"exact",head:true}).eq("status","pending");S.pendingCount=count||0}}catch(e){}
}
async function logout(){await sb.auth.signOut();location.reload()}

/* ---------- shell ---------- */
function shell(){
  const co=S.settings.company||{};
  $("#app").innerHTML=`<header class="top"><div class="top-in"><div class="brandrow">
    <div class="brand"><h1>دفتر الشقق</h1><span>${esc(co.name||"")}</span></div>
    <div class="period"><span>الفترة</span><input type="date" id="pFrom" value="${S.from}"><span>إلى</span><input type="date" id="pTo" value="${S.to}">
      <select id="pPreset" style="width:auto"><option value="">اختصار…</option><option value="m">هذا الشهر</option><option value="pm">الشهر السابق</option><option value="y">هذه السنة</option><option value="all">كل الفترات</option></select></div>
    <div class="userbox"><span>${esc(S.profile.full_name||S.profile.username)}${isAdmin()?' <span class="chip">مدير</span>':""}</span><button class="btn sm" data-act="account">حسابي</button><button class="btn sm" data-act="logout">خروج</button></div>
   </div><nav class="tabs" id="tabs" role="tablist"></nav></div></header><main id="main"></main>`;
  $("#pFrom").onchange=e=>{if(e.target.value){S.from=e.target.value;savePeriod()}};
  $("#pTo").onchange=e=>{if(e.target.value){S.to=e.target.value;savePeriod()}};
  $("#pPreset").onchange=e=>{const p=e.target.value;e.target.value="";if(!p)return;const d=new Date();
    if(p==="m"){S.from=iso(new Date(d.getFullYear(),d.getMonth(),1));S.to=iso(new Date(d.getFullYear(),d.getMonth()+1,0))}
    else if(p==="pm"){S.from=iso(new Date(d.getFullYear(),d.getMonth()-1,1));S.to=iso(new Date(d.getFullYear(),d.getMonth(),0))}
    else if(p==="y"){S.from=iso(new Date(d.getFullYear(),0,1));S.to=iso(new Date(d.getFullYear(),11,31))}
    else{S.from="2000-01-01";S.to="2100-12-31"}
    $("#pFrom").value=S.from;$("#pTo").value=S.to;savePeriod()};
  drawTabs();
}
function savePeriod(){store.set("dk.from",S.from);store.set("dk.to",S.to);drawTab()}
function drawTabs(){$("#tabs").innerHTML=visibleTabs().map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.tab===k}" data-act="tab" data-tab="${k}">${l}${k==="expenses"&&S.pendingCount&&flag("approve")?`<span class="badge">${S.pendingCount}</span>`:""}</button>`).join("")}
let drawSeq=0;
async function drawTab(){const seq=++drawSeq;const m=$("#main");if(!m)return;
  if(!V[S.tab]){m.innerHTML=`<div class="panel"><h3>مفيش شاشات متاحة لحسابك</h3><p class="sub">كلم مدير النظام يديك صلاحيات.</p></div>`;return}
  if(!m.innerHTML.trim())m.innerHTML=`<div class="loading">جاري التحميل…</div>`;
  try{const html=await V[S.tab]();if(seq===drawSeq)m.innerHTML=html}

async function reloadAll(){await refreshShared();drawTabs();await drawTab()}

/* ---------- modal ---------- */
function modal(html,wide){closeModal();const s=document.createElement("div");s.className="scrim";s.innerHTML=`<div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener("click",e=>{if(e.target===s||e.target.closest("[data-close]"))closeModal()});$("#modalRoot").appendChild(s);document.body.style.overflow="hidden";
  const f=s.querySelector("input:not([type=hidden]):not([disabled]),select,textarea");if(f)f.focus({preventScroll:true});return s.querySelector(".modal")}
function closeModal(){$("#modalRoot").innerHTML="";document.body.style.overflow=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function confirmBox(msg,onYes,note){const m=modal(`<h3>${esc(msg)}</h3><p class="sub">${esc(note||"الحذف نهائي ولا يمكن التراجع عنه.")}</p><div class="btns"><button class="btn primary" id="cy" style="background:var(--neg);border-color:var(--neg)">نعم</button><button class="btn" data-close>إلغاء</button></div>`);
  m.querySelector("#cy").onclick=()=>{closeModal();onYes()}}

/* ---------- generic form ---------- */
const optsL=(k,empty)=>()=>[...(empty?[["",empty]]:[]),...(S.L[k]||[]).map(x=>[x.id,x.name])];
function formModal({title,fields,values,wide,onSave,extraHtml,afterRender}){
  const v=Object.assign({},values||{});
  const fh=f=>{const {k,label,type="text",req,opts,full,hint}=f;const val=v[k]??"";let inp;
    if(type==="select")inp=`<select id="f_${k}">${opts().map(([o,t])=>`<option value="${esc(o)}" ${String(o)===String(val)?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
    else if(type==="textarea")inp=`<textarea id="f_${k}">${esc(val)}</textarea>`;
    else if(type==="custom")return `<div style="grid-column:1/-1" id="f_${k}"></div>`;
    else inp=`<input id="f_${k}" type="${type}" ${type==="number"?'step="any" inputmode="decimal" dir="ltr"':""} value="${esc(val)}">`;
    return `<label class="f" ${full||type==="textarea"?'style="grid-column:1/-1"':""}>${label}${req?" *":""}${inp}${hint?`<span class="sub">${hint}</span>`:""}</label>`};
  const m=modal(`<div class="modal-h"><h3>${title}</h3><button class="btn sm" data-close>إغلاق</button></div>
    <form id="frm" class="grid2" novalidate>${fields.map(fh).join("")}</form>${extraHtml||""}<div id="ferr" class="err"></div>
    <div class="btns"><button class="btn primary" id="fsave">حفظ</button><button class="btn" data-close>إلغاء</button></div>`,wide);
  const g=k=>m.querySelector("#f_"+k);
  if(afterRender)afterRender(m,g);
  m.querySelector("#frm").addEventListener("submit",e=>e.preventDefault());
  m.querySelector("#fsave").onclick=async()=>{const out={};const errs=[];
    fields.forEach(f=>{if(f.type==="custom")return;let x=g(f.k).value;if(typeof x==="string")x=x.trim();if(f.type==="number")x=x===""?null:+x;if(x==="")x=null;out[f.k]=x;if(f.req&&(x===null||x===undefined))errs.push(f.label)});
    const er=m.querySelector("#ferr");if(errs.length){er.textContent="اكمل: "+errs.join("، ");return}
    const btn=m.querySelector("#fsave");btn.disabled=true;er.textContent="";
    try{const r=await onSave(out,m);if(r===false){btn.disabled=false;return}closeModal();toast("تم الحفظ");await reloadAll()}
    catch(e){er.textContent=errMsg(e);btn.disabled=false}};
  return m;
}
async function saveRow(table,id,row){
  if(id){const d=await q(sb.from(table).update(row).eq("id",id).select("id"));if(!d.length)throw new Error("ليس لديك صلاحية تعديل هذا السجل");return id}
  const d=await q(sb.from(table).insert(row).select("id").single());return d.id}
async function delRow(table,id){try{const d=await q(sb.from(table).delete().eq("id",id).select("id"));if(!d.length)throw new Error("ليس لديك صلاحية حذف هذا السجل");toast("تم الحذف");await reloadAll()}catch(e){toast(errMsg(e),1)}}

/* ---------- periods editor (ملكية / شركاء) ---------- */
function periodsEditor(el,P,pool){
  const key=pool==="owners"?"owner_id":"partner_id";const who=pool==="owners"?"مالك":"شريك";
  if(!P.length)P.push({from:"2020-01-01",shares:[{[key]:"",pct:100}]});
  const sumOf=p=>r2(p.shares.reduce((s,x)=>s+(+x.pct||0),0));
  const draw=()=>{P.sort((a,b)=>(a.from||"")<(b.from||"")?-1:1);
    el.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px">${P.map((p,i)=>{const sum=sumOf(p);
      return `<div class="period-box"><div class="btns" style="justify-content:space-between"><label class="f" style="flex-direction:row;align-items:center;gap:8px">سارية من <input type="date" data-pi="${i}" data-pk="from" value="${esc(p.from)}" style="width:160px"></label>${P.length>1?`<button type="button" class="btn sm danger" data-pdel="${i}">حذف الفترة</button>`:""}</div>
      ${p.shares.map((s,j)=>`<div class="srow"><select data-pi="${i}" data-sj="${j}" data-sk="${key}"><option value="">— اختر ${who} —</option>${(S.L[pool]||[]).map(o=>`<option value="${o.id}" ${o.id===s[key]?"selected":""}>${esc(o.name)}</option>`).join("")}</select>
        <input type="number" step="any" inputmode="decimal" dir="ltr" data-pi="${i}" data-sj="${j}" data-sk="pct" value="${esc(s.pct)}" placeholder="%"><button type="button" class="btn sm" data-sdel="${i}:${j}" aria-label="حذف السطر">✕</button></div>`).join("")}
      <div class="btns" style="justify-content:space-between"><button type="button" class="btn sm" data-sadd="${i}">+ ${who}</button><span class="sumline sub ${sum===100?"pos":"neg"}">المجموع ${sum}%${sum===100?"":" — لازم 100%"}</span></div></div>`}).join("")}
      <div><button type="button" class="btn sm" data-padd>+ تغيير النسب من تاريخ جديد</button> <span class="sub">لما ${who} يبيع نصيبه أو النسب تتغير، أضف فترة جديدة بدل ما تعدل القديمة، عشان حسابات الشهور اللي فاتت تفضل صح.</span></div>
      ${!(S.L[pool]||[]).length?`<div class="err">أضف ${pool==="owners"?"الملاك":"الشركاء"} الأول من شاشتهم.</div>`:""}</div>`};
  el.addEventListener("input",e=>{const t=e.target;if(t.dataset.pi==null)return;const p=P[+t.dataset.pi];
    if(t.dataset.pk)p.from=t.value;else p.shares[+t.dataset.sj][t.dataset.sk]=t.dataset.sk==="pct"?(t.value===""?"":+t.value):t.value;
    if(t.dataset.sk==="pct"){const sum=sumOf(p);const sl=t.closest(".period-box").querySelector(".sumline");sl.className="sumline sub "+(sum===100?"pos":"neg");sl.textContent=`المجموع ${sum}%${sum===100?"":" — لازم 100%"}`}});
  el.addEventListener("change",e=>{if(e.target.dataset.pk)draw()});
  el.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
    if(t.dataset.sadd!=null){P[+t.dataset.sadd].shares.push({[key]:"",pct:""});draw()}
    else if(t.dataset.sdel){const [i,j]=t.dataset.sdel.split(":").map(Number);P[i].shares.splice(j,1);if(!P[i].shares.length)P[i].shares.push({[key]:"",pct:""});draw()}
    else if(t.dataset.pdel!=null){P.splice(+t.dataset.pdel,1);draw()}
    else if(t.dataset.padd!=null){P.push({from:today(),shares:clone(P[P.length-1].shares)});draw()}});
  draw();
}
function checkPeriods(P,key){for(const p of P){if(!p.from)return "تاريخ بداية كل فترة";const ids=p.shares.map(s=>s[key]);
  if(ids.some(x=>!x))return "اختيار الاسم في كل سطر";if(new Set(ids).size!==ids.length)return "نفس الاسم متكرر في فترة واحدة";
  if(r2(p.shares.reduce((s,x)=>s+(+x.pct||0),0))!==100)return "مجموع النسب 100% في كل فترة"}return ""}
function sharesAt(periods,date){const ps=(periods||[]).filter(p=>p.from).slice().sort((a,b)=>a.from<b.from?-1:1);if(!ps.length)return [];let c=ps[0];for(const p of ps)if(p.from<=date)c=p;return c.shares||[]}

/* ---------- tables ---------- */
function table(heads,rows,foot){if(!rows.length)return `<div class="tbl-wrap"><div class="empty">لا توجد بيانات</div></div>`;
  return `<div class="tbl-wrap"><table><thead><tr>${heads.map(h=>`<th class="${h[1]||""}">${h[0]}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody>${foot?`<tfoot><tr>${foot}</tr></tfoot>`:""}</table></div>`}
const rowBtns=(screen,t,id,more="")=>{const b=[more];if(lvl(screen)>=3)b.push(`<button class="btn sm" data-act="edit" data-t="${t}" data-id="${id}">تعديل</button>`);if(lvl(screen)>=4)b.push(`<button class="btn sm danger" data-act="del" data-t="${t}" data-id="${id}">حذف</button>`);return `<td><div class="btns">${b.join("")}</div></td>`};

function statusOf(c){const t=today();if(c.end_date<t)return ["منتهي","gray"];if(c.start_date>t)return ["قادم","warn"];return ["سارٍ",""]}

async function statementsView(party,t,screen,selKey,title,subtitle,cols,note){

  cache[t]=list;const bm=Object.fromEntries(sum.map(s=>[s.pid,s]));const z={opening:0,inc:0,outg:0,closing:0};
  const canPay=flag("disburse");
  const rows=list.map(p=>{const s=bm[p.id]||z;return `<tr><td><button class="btn link" data-act="sel" data-key="${selKey}" data-id="${p.id}">${esc(p.name)}</button>${p.phone?`<div class="sub num">${esc(p.phone)}</div>`:""}</td>
    <td class="amt">${sgn(s.opening)}</td><td class="amt">${money(s.inc)}</td><td class="amt">${money(-s.outg)}</td><td class="amt"><b>${sgn(s.closing)}</b></td>
    ${rowBtns(screen,t,p.id,canPay?`<button class="btn sm" data-act="payout" data-kind="${party}" data-id="${p.id}" data-bal="${s.closing}">${party==="partner"?"مسحوبات":"صرف"}</button>`:"")}</tr>`});
  let detail="";const sel=S.sel[selKey];const p=list.find(x=>x.id===sel);

    cache.stmt={party,name:p.name,opening:op?+op.amount:0,rest,inc,out,closing:bal};
    detail=`<div class="panel" id="stmt"><div class="sechead"><div><h3>كشف حساب: ${esc(p.name)}</h3><p class="sub">من ${dStr(S.from)} إلى ${dStr(S.to)} · ${note}</p></div><div class="btns"><button class="btn sm" data-act="printStmt">طباعة الكشف</button><button class="btn sm" data-act="sel" data-key="${selKey}" data-id="">إغلاق</button></div></div>
     <div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>البيان</th><th class="amt">له</th><th class="amt">عليه</th><th class="amt">الرصيد</th><th></th></tr></thead><tbody>
     <tr><td>${dStr(S.from)}</td><td>رصيد أول المدة</td><td></td><td></td><td class="amt">${sgn(op?op.amount:0)}</td><td></td></tr>${trs.join("")}</tbody>
     <tfoot><tr><td colspan="2">إجمالي الفترة ورصيد آخر المدة</td><td class="amt">${money(inc)}</td><td class="amt">${money(out)}</td><td class="amt">${sgn(bal)}</td><td></td></tr></tfoot></table></div></div>`}
  return {html:`${detail}${table(cols,rows)}`,list};
}

    {k:"company_pct",label:"نسبة الشركة من الإيجار %",type:"number",hint:"لو سبتها فاضية هتتاخد من إعدادات الشقة"}];
  if(showComm)fields.push({k:"employee_id",label:"الموظف صاحب العقد",type:"select",opts:()=>[["","— بدون عمولة —"],...emps.map(e=>[e.id,e.name])]},{k:"comm_pct",label:"عمولة الموظف %",type:"number",hint:"بتتملى تلقائياً من نسبة الموظف"});

    afterRender:(m,g)=>{
      const recalc=()=>{const tot=r2((+g("unit_price").value||0)*(+g("units").value||0));const co=+g("company_pct").value||(+((S.L.apartments.find(a=>a.id===g("apt_id").value)||{}).company_pct)||0);
        m.querySelector("#calc").innerHTML=`قيمة العقد: <b>${money(tot)}</b> · نسبة الشركة ${co}% = ${money(tot*co/100)}${showComm&&g("comm_pct").value?` · عمولة الموظف ${money(tot*(+g("comm_pct").value)/100)}`:""}`};

      ["unit_price","units","company_pct",...(showComm?["comm_pct"]:[])].forEach(k=>g(k).addEventListener("input",recalc));recalc()},
    onSave:async out=>{if(out.end_date<out.start_date)throw new Error("تاريخ النهاية قبل البداية");

        else await q(sb.from("contract_commissions").delete().eq("contract_id",id))}}});

   <div class="grid2">

    ${isNew?`<label class="f">اسم المستخدم (بالإنجليزي) *<input id="u_user" dir="ltr" autocapitalize="off" autocomplete="off"></label><label class="f">الباسورد *<input id="u_pass" dir="ltr" autocomplete="new-password"></label>`:`<label class="f">اسم المستخدم<input value="${esc(u.username)}" disabled dir="ltr"></label>`}
    <label class="f">مرتبط بموظف (لحساب عمولاته)<select id="u_emp"><option value="">— لا —</option>${emps.map(e=>`<option value="${e.id}" ${u&&u.employee_id===e.id?"selected":""}>${esc(e.name)} (${+e.default_pct}%)</option>`).join("")}</select></label>
   </div>
   <label class="chk"><input type="checkbox" id="u_admin" ${u&&u.is_admin?"checked":""}><span><b>مدير النظام</b> <span class="sub">كل الصلاحيات، وإدارة المستخدمين والإعدادات</span></span></label>
   ${!isNew?`<label class="chk"><input type="checkbox" id="u_active" ${u.active?"checked":""}><span><b>الحساب مفعّل</b> <span class="sub">شيل العلامة لإيقاف الحساب من غير ما تحذفه</span></span></label>`:""}
   <div id="permBox" class="panel" style="padding:12px">
    <div class="btns"><span class="sub">قوالب سريعة:</span><button type="button" class="btn sm" data-preset="sales">موظف مبيعات</button><button type="button" class="btn sm" data-preset="acct">محاسب</button><button type="button" class="btn sm" data-preset="view">مشاهدة فقط</button></div>
    <h3>الشاشات</h3><div class="permgrid">${SCREENS.map(([k,l])=>`<span>${l}</span><select data-scr="${k}">${LEVELS.map(([n,t])=>`<option value="${n}" ${(+perms.screens[k]||0)===n?"selected":""}>${t}</option>`).join("")}</select>`).join("")}</div>
    <h3>صلاحيات الفلوس</h3>${FLAGS.map(([k,l,d])=>`<label class="chk"><input type="checkbox" data-flag="${k}" ${perms[k]?"checked":""}><span><b>${l}</b> <span class="sub">${d}</span></span></label>`).join("")}
    <p class="sub">لو الموظف مالوش صلاحية "العمولات"، خانة العمولة مش هتظهر له في العقد، والعقد يتسجل باسمه وعمولته تتحسب من نسبته الافتراضية.</p>
   </div><div id="ferr" class="err"></div>
   <div class="btns"><button class="btn primary" id="fsave">حفظ</button><button class="btn" data-close>إلغاء</button></div>`,1);
  const PRESETS={sales:{screens:{contracts:2,payments:2,expenses:2,apartments:1},receive:true},acct:{screens:{dash:1,contracts:3,payments:3,expenses:3,apartments:1,owners:1,partners:1},receive:true,disburse:true},view:{screens:{dash:1,contracts:1,payments:1,expenses:1,apartments:1,owners:1}}};
  const adm=m.querySelector("#u_admin");const syncAdm=()=>{m.querySelector("#permBox").hidden=adm.checked};adm.onchange=syncAdm;syncAdm();
  m.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{const p=PRESETS[b.dataset.preset];m.querySelectorAll("[data-scr]").forEach(s=>s.value=p.screens[s.dataset.scr]||0);m.querySelectorAll("[data-flag]").forEach(c=>c.checked=!!p[c.dataset.flag])});
  m.querySelector("#fsave").onclick=async()=>{const er=m.querySelector("#ferr");er.textContent="";
    const np={screens:{}};m.querySelectorAll("[data-scr]").forEach(s=>{if(+s.value)np.screens[s.dataset.scr]=+s.value});m.querySelectorAll("[data-flag]").forEach(c=>{if(c.checked)np[c.dataset.flag]=true});
    const emp=m.querySelector("#u_emp").value||null;const name=m.querySelector("#u_name").value.trim();
    try{if(isNew){const un=m.querySelector("#u_user").value.trim().toLowerCase(),pw=m.querySelector("#u_pass").value;if(!name||!un||!pw)throw new Error("اكمل الاسم واسم المستخدم والباسورد");
        await q(sb.rpc("admin_create_user",{p_username:un,p_password:pw,p_name:name,p_is_admin:adm.checked,p_employee_id:emp,p_perms:np}))}
      else{const upd={full_name:name,is_admin:adm.checked,employee_id:emp,perms:np};const a=m.querySelector("#u_active");if(a)upd.active=a.checked;
        const d=await q(sb.from("profiles").update(upd).eq("id",u.id).select("id"));if(!d.length)throw new Error("تعذر الحفظ")}
      closeModal();toast(isNew?"تم إنشاء المستخدم":"تم الحفظ");await reloadAll()}catch(e){er.textContent=errMsg(e)}};
}

/* ---------- documents ---------- */
const CO=()=>{const c=S.settings.company||{};return {name:c.name||"[اسم الشركة]",address:c.address||"[عنوان الشركة]",rep:c.rep||"[اسم الممثل القانوني]",cr:c.cr||"[رقم السجل التجاري]",city:c.city||"القاهرة",payDays:c.payDays||10}};
function leaseDoc(c,a){const co=CO();const tot=total(c);const unit=c.rent_type==="daily"?"ليلة":"شهر";a=a||{};
  return `<div class="doc"><h1>عقد إيجار شقة مفروشة</h1><div class="dmeta">رقم ${esc(c.no)} · حُرر في ${esc(c.sign_date)} بمدينة ${esc(co.city)}</div>
  <h4>أولاً: الطرف الأول (المؤجر)</h4><p>${esc(co.name)}، سجل تجاري رقم ${esc(co.cr)}، ومقرها ${esc(co.address)}، ويمثلها السيد/ ${esc(co.rep)}، بصفتها القائمة على إدارة الوحدة نيابةً عن ملاكها.</p>
  <h4>ثانياً: الطرف الثاني (المستأجر)</h4><p>السيد/ ${esc(c.tenant_name)}${c.tenant_nat?`، الجنسية: ${esc(c.tenant_nat)}`:""}${c.tenant_nid?`، إثبات شخصية رقم ${esc(c.tenant_nid)}`:""}${c.tenant_phone?`، تليفون ${esc(c.tenant_phone)}`:""}.</p>
  <h4>البنود</h4><ol>
  <li>أجّر الطرف الأول للطرف الثاني الشقة ${esc(a.name||lname("apartments",c.apt_id))}${a.floor?`، الدور ${esc(a.floor)}`:""}${a.address?`، الكائنة في ${esc(a.address)}`:""}${a.rooms?`، وتتكون من ${esc(+a.rooms)} غرف`:""}، مفروشة بالمنقولات الموضحة بقائمة الجرد المرفقة والتي تُعد جزءاً لا يتجزأ من هذا العقد.</li>
  <li>مدة الإيجار ${esc(+c.units)} ${unit} تبدأ من ${esc(c.start_date)} وتنتهي في ${esc(c.end_date)}، ولا يتجدد العقد إلا باتفاق كتابي جديد.</li>
  <li>القيمة الإيجارية ${moneyT(c.unit_price)} عن كل ${unit}، بإجمالي ${moneyT(tot)} عن كامل المدة${c.rent_type==="monthly"?"، تُدفع مقدماً في أول كل شهر":"، تُدفع مقدماً عند الاستلام"}.</li>
  <li>دفع الطرف الثاني مبلغ ${moneyT(c.deposit||0)} تأميناً يُرد عند انتهاء العقد بعد استلام الشقة ومحتوياتها بحالتها وخصم أي تلفيات أو مستحقات.</li>
  <li>يستعمل الطرف الثاني الشقة للسكن الخاص فقط، ولا يحق له التأجير من الباطن أو التنازل عنها للغير.</li>
  <li>يلتزم الطرف الثاني بالمحافظة على الشقة ومحتوياتها، ويتحمل قيمة أي تلف ناتج عن سوء الاستعمال.</li>
  <li>يلتزم الطرف الثاني بتسليم صورة إثبات الشخصية لكل المقيمين معه لإخطار الجهات المختصة وفقاً للقانون.</li>
  <li>في حالة تأخر الطرف الثاني عن الإخلاء في نهاية المدة يلتزم بسداد مقابل انتفاع عن كل ${unit} تأخير بنفس القيمة الإيجارية.</li>
  ${c.notes?`<li>${esc(c.notes)}</li>`:""}
  <li>حُرر هذا العقد من نسختين بيد كل طرف نسخة للعمل بموجبها، وتختص محاكم ${esc(co.city)} بنظر أي نزاع ينشأ عنه.</li></ol>
  <div class="sigs"><div>الطرف الأول<br>${esc(co.name)}</div><div>الطرف الثاني<br>${esc(c.tenant_name)}</div></div></div>`}
function mgmtDoc(a,owners,date){const co=CO();const sh=sharesAt(a.ownership,date);const ob=Object.fromEntries((owners||[]).map(o=>[o.id,o]));
  return `<div class="doc"><h1>عقد إدارة وتأجير وحدة مفروشة</h1><div class="dmeta">حُرر في ${esc(date)} بمدينة ${esc(co.city)}</div>
  <h4>أولاً: الطرف الأول (الملاك)</h4><table style="width:100%;border-collapse:collapse"><thead><tr><th>الاسم</th><th>إثبات الشخصية</th><th>التليفون</th><th>نسبة الملكية</th></tr></thead><tbody>
  ${sh.map(s=>{const o=ob[s.owner_id]||{name:lname("owners",s.owner_id)};return `<tr><td>${esc(o.name)}</td><td>${esc(o.nid||"")}</td><td>${esc(o.phone||"")}</td><td>${esc(s.pct)}%</td></tr>`}).join("")}</tbody></table>
  <h4>ثانياً: الطرف الثاني (الشركة)</h4><p>${esc(co.name)}، سجل تجاري رقم ${esc(co.cr)}، ومقرها ${esc(co.address)}، ويمثلها السيد/ ${esc(co.rep)}.</p>
  <h4>البنود</h4><ol>
  <li>يفوض الطرف الأول الطرف الثاني في إدارة وتأجير الشقة ${esc(a.name)}${a.address?` الكائنة في ${esc(a.address)}`:""} مفروشة، بالإيجار اليومي أو الشهري، وتحرير عقود الإيجار وتحصيل القيمة الإيجارية.</li>
  <li>يستحق الطرف الثاني نسبة ${esc(+a.company_pct)}% من إجمالي الإيجار المحصل مقابل الإدارة، ويُوزع الباقي على الملاك كل حسب نسبة ملكيته الموضحة أعلاه.</li>
  <li>يتحمل الطرف الثاني مصاريف التشغيل من نظافة وفواتير وصيانة بسيطة وعمولات ومرتبات.</li>
  <li>يتحمل الطرف الأول تكاليف الإصلاحات الكبيرة والاستبدال (أجهزة التكييف والسباكة والكهرباء الرئيسية والدهانات)، وتُخصم من مستحقاته كل حسب نسبته بعد إخطاره.</li>
  <li>يلتزم الطرف الثاني بتقديم كشف حساب شهري لكل مالك يوضح الإيجارات المحصلة والخصومات وصافي المستحق، ويُصرف المستحق خلال ${esc(co.payDays)} أيام من نهاية كل شهر.</li>
  <li>مدة هذا العقد سنة ميلادية تبدأ من ${esc(date)} وتتجدد تلقائياً ما لم يخطر أحد الطرفين الآخر كتابةً قبل انتهائها بشهر على الأقل، مع احترام عقود الإيجار السارية.</li>
  <li>حُرر هذا العقد من ${sh.length+1} نسخ بيد كل طرف نسخة، وتختص محاكم ${esc(co.city)} بنظر أي نزاع ينشأ عنه.</li></ol>
  <div class="sigs">${sh.map(s=>`<div>المالك<br>${esc((ob[s.owner_id]||{}).name||lname("owners",s.owner_id))}</div>`).join("")}<div>الطرف الثاني<br>${esc(co.name)}</div></div></div>`}
const PRINT_CSS=`body{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;direction:rtl;max-width:820px;margin:24px auto;padding:0 16px;color:#111;line-height:1.9}
 h1{text-align:center;font-size:22px;margin:0}.dmeta{text-align:center;color:#555;font-size:13px;margin-bottom:16px}table{width:100%;border-collapse:collapse;font-size:14px}
 td,th{border:1px solid #bbb;padding:6px 8px;text-align:right}th{background:#f2f2f2}.amt{text-align:left}.sigs{display:flex;gap:24px;margin-top:40px}.sigs div{flex:1;border-top:1px solid #888;padding-top:6px;text-align:center}
 .num{direction:ltr;unicode-bidi:isolate;display:inline-block}.doc{border:0;padding:0}@media print{body{margin:0}}`;
function printHtml(title,inner){const w=window.open("","_blank");if(!w){toast("المتصفح منع فتح نافذة الطباعة، اسمح بالنوافذ المنبثقة",1);return}
  w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Reem+Kufi:wght@500&display=swap"><style>${PRINT_CSS}</style></head><body>${inner}<script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script></body></html>`);w.document.close()}
function showDoc(title,html){const m=modal(`<div class="modal-h"><h3>${esc(title)}</h3><button class="btn sm" data-close>إغلاق</button></div>
  <div class="btns"><button class="btn primary" id="dprint">طباعة / حفظ PDF</button><button class="btn" id="dcopy">نسخ النص</button></div><div style="overflow-x:auto">${html}</div>`,1);
  m.querySelector("#dprint").onclick=()=>printHtml(title,html);
  m.querySelector("#dcopy").onclick=async()=>{try{await navigator.clipboard.writeText(m.querySelector(".doc").innerText);toast("تم النسخ")}catch(e){toast("تعذر النسخ",1)}}}

/* ---------- account ---------- */
function accountForm(){const m=modal(`<div class="modal-h"><h3>حسابي</h3><button class="btn sm" data-close>إغلاق</button></div>
  <p>اسم المستخدم: <b class="num">${esc(S.profile.username)}</b></p>
  <label class="f">باسورد جديد<input id="np1" type="password" dir="ltr" autocomplete="new-password"></label><label class="f">تأكيد الباسورد<input id="np2" type="password" dir="ltr" autocomplete="new-password"></label>
  <div id="ferr" class="err"></div><div class="btns"><button class="btn primary" id="fsave">تغيير الباسورد</button><button class="btn" data-close>إلغاء</button></div>`);
  m.querySelector("#fsave").onclick=async()=>{const a=m.querySelector("#np1").value,b=m.querySelector("#np2").value;const er=m.querySelector("#ferr");
    if(a.length<6){er.textContent="الباسورد لازم 6 حروف على الأقل";return}if(a!==b){er.textContent="الباسورد والتأكيد مش زي بعض";return}
    const {error}=await sb.auth.updateUser({password:a});if(error){er.textContent=errMsg(error);return}closeModal();toast("تم تغيير الباسورد")}}

/* ---------- actions ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const {act,id,t}=b.dataset;
  try{
  if(act==="tab"){S.tab=b.dataset.tab;store.set("dk.tab",S.tab);drawTabs();$("#main").innerHTML="";await drawTab();scrollTo(0,0)}
  else if(act==="reload")await reloadAll();
  else if(act==="logout")await logout();
  else if(act==="account")accountForm();
  else if(act==="new")openEntity(t,null);
  else if(act==="edit"){if(t==="contracts")return openContract((cache.contracts||[]).find(x=>x.id===id));if(t==="payments"){const r=await q(sb.from("payments").select("*").eq("id",id).single());return openPayment(r)}
    const r=await q(sb.from(t).select("*").eq("id",id).single());openEntity(t,r)}
  else if(act==="del"){confirmBox("تأكيد الحذف؟",()=>delRow(t,id))}
  else if(act==="newContract")await openContract(null);
  else if(act==="newPayment")await openPayment(null);
  else if(act==="pay")await openPayment(null,id);
  else if(act==="newExpense")openExpense(null);
  else if(act==="editExpense")openExpense((cache.expenses||[]).find(x=>x.id===id));
  else if(act==="approve"){const d=await q(sb.from("expenses").update({status:"approved",reject_reason:null}).eq("id",id).select("id"));if(!d.length)throw new Error("ليس لديك صلاحية الاعتماد");toast("تم اعتماد المصروف");await reloadAll()}
  else if(act==="reject"){formModal({title:"رفض المصروف",fields:[{k:"reason",label:"سبب الرفض",full:1}],onSave:async out=>{const d=await q(sb.from("expenses").update({status:"rejected",reject_reason:out.reason}).eq("id",id).select("id"));if(!d.length)throw new Error("ليس لديك صلاحية")}})}
  else if(act==="lease"){const c=(cache.contracts||[]).find(x=>x.id===id);let a=null;try{a=await q(sb.from("apartments").select("*").eq("id",c.apt_id).maybeSingle())}catch(err){}showDoc(`عقد إيجار ${c.no}`,leaseDoc(c,a))}
  else if(act==="mgmt"){const a=(cache.apartments||[]).find(x=>x.id===id);let ow=[];try{ow=await q(sb.from("owners").select("*"))}catch(err){}showDoc(`عقد إدارة ${a.name}`,mgmtDoc(a,ow,today()))}
  else if(act==="payout")openPayout(b.dataset.kind,id,+b.dataset.bal||0);
  else if(act==="sel"){S.sel[b.dataset.key]=id;await drawTab();if(id){const s=$("#stmt");s&&s.scrollIntoView({block:"start"})}}
  else if(act==="goowner"){S.sel.owner=id;S.tab="owners";drawTabs();await drawTab()}
  else if(act==="printStmt"){const s=cache.stmt;const lbl={owner:"مالك",employee:"موظف",partner:"شريك"}[s.party];let bal=s.opening;
    const rows=s.rest.map(l=>{bal+=+l.amount;return `<tr><td>${esc(l.d)}</td><td>${esc(l.descr)}</td><td class="amt">${l.amount>0?moneyT(l.amount):""}</td><td class="amt">${l.amount<0?moneyT(-l.amount):""}</td><td class="amt">${moneyT(bal)}</td></tr>`}).join("");
    printHtml(`كشف حساب ${s.name}`,`<h1>كشف حساب ${lbl}: ${esc(s.name)}</h1><div class="dmeta">${esc(CO().name)} · من ${esc(S.from)} إلى ${esc(S.to)}</div><table><thead><tr><th>التاريخ</th><th>البيان</th><th>له</th><th>عليه</th><th>الرصيد</th></tr></thead><tbody><tr><td>${esc(S.from)}</td><td>رصيد أول المدة</td><td></td><td></td><td class="amt">${moneyT(s.opening)}</td></tr>${rows}<tr><th colspan="2">إجمالي الفترة ورصيد آخر المدة</th><th class="amt">${moneyT(s.inc)}</th><th class="amt">${moneyT(s.out)}</th><th class="amt">${moneyT(s.closing)}</th></tr></tbody></table>`)}
  else if(act==="shares")sharesForm();
  else if(act==="newUser")userForm(null);
  else if(act==="editUser")userForm((cache.users||[]).find(x=>x.id===id));
  else if(act==="resetPw"){const u=(cache.users||[]).find(x=>x.id===id);formModal({title:`باسورد جديد لـ ${esc(u.full_name||u.username)}`,fields:[{k:"pw",label:"الباسورد الجديد",req:1}],onSave:async out=>{await q(sb.rpc("admin_set_password",{p_uid:id,p_password:out.pw}))}})}
  else if(act==="delUser"){const u=(cache.users||[]).find(x=>x.id===id);confirmBox(`حذف المستخدم ${u.full_name||u.username}؟`,async()=>{try{await q(sb.rpc("admin_delete_user",{p_uid:id}));toast("تم الحذف");await reloadAll()}catch(err){toast(errMsg(err),1)}},"هيتمنع من الدخول نهائياً. العمليات اللي سجلها هتفضل موجودة. لو عايز توقفه مؤقتاً استخدم \"الحساب مفعّل\" بدل الحذف.")}
  else if(act==="saveCompany"){const o={};["name","rep","cr","city","address","payDays"].forEach(k=>o[k]=$("#s_"+k).value.trim());await q(sb.from("app_settings").update({value:o}).eq("key","company"));toast("تم الحفظ");await reloadAll();shell();await drawTab()}
  else if(act==="backup"){const out={exported:new Date().toISOString()};for(const tb of ["app_settings","owners","apartments","employees","partners","contracts","contract_commissions","payments","expenses","payouts","profiles"])out[tb]=await q(sb.from(tb).select("*"));
    const blob=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`نسخة-دفتر-الشقق-${today()}.json`;document.body.appendChild(a);a.click();a.remove();toast("تم تحميل النسخة")}
  }catch(err){toast(errMsg(err),1)}
});

boot().catch(e=>{$("#app").innerHTML=`<div class="center"><div class="authbox"><h1>دفتر الشقق</h1><p class="err">${esc(errMsg(e))}</p></div></div>`});
})();
</script>
</body>
